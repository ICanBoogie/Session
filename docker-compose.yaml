---
services:
  app84:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.4.0RC3'
    environment: &env
      PHP_IDE_CONFIG: 'serverName=icanboogie-session'
    volumes: &vol
      - .:/app:delegated
      - ~/.composer:/root/.composer:delegated
    working_dir: /app
